const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw91TllUVB7fomtccowdz2ow5f2Vh5FHqJODzd2xRA_5m6u_g1k7QcrmOaXZYYjp3U9/exec";

let resultSent = false;

function sendResultToSheet(){
  if(resultSent) return;
  resultSent = true;

  const payload = {
    studentName: studentName || "Нэргүй",
    score: goals - oppGoals,
    correct: correct,
    totalQuestions: activeQuestions && activeQuestions.length ? activeQuestions.length : questions.length,
    goals: goals,
    oppGoals: oppGoals,
    time: sec + " секунд"
  };

  fetch(GOOGLE_SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(() => {
    console.log("Google Sheet рүү илгээхэд алдаа гарлаа.");

let sceneRef,audioCtx,idx=0,half=1,sec=0,goals=0,oppGoals=0,correct=0,attack=0,passesMade=0,timer=null,locked=false,activeQuestions=[];
const catEl=document.getElementById('category'),qEl=document.getElementById('question'),ansEl=document.getElementById('answers'),actEl=document.getElementById('actions');

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(f,d=.12,type='sine',vol=.035,delay=0){if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}
function sound(s){initAudio();if(s==='pass'){tone(440,.08,'square');tone(660,.1,'sine',.03,.08)}if(s==='bad'){tone(170,.16,'sawtooth');tone(120,.12,'square',.025,.1)}if(s==='shot'){tone(280,.08,'square');tone(900,.18,'sine',.045,.08)}if(s==='goal'){[330,440,554,740,988].forEach((f,i)=>tone(f,.18,'sine',.055,i*.08))}if(s==='save'){tone(150,.09,'square');tone(90,.2,'sawtooth',.025,.08)}if(s==='whistle'){tone(1600,.2);tone(1900,.18,'sine',.03,.16)}}

class RealLookScene extends Phaser.Scene{
 create(){
  sceneRef=this;this.W=this.scale.width;this.H=this.scale.height;this.home=[];this.away=[];this.markers=[];
  this.drawWorld();this.createTeams();this.createBall();this.createHUD();this.resetKickoff();
 }
 drawWorld(){
  const w=this.W,h=this.H,g=this.add.graphics();
  g.fillStyle(0x0b1020,1);g.fillRect(0,0,w,h);
  // 3D-like stands
  g.fillStyle(0x111827,1);g.fillRect(0,0,w,170);
  const colors=[0xfacc15,0x22c55e,0xffffff,0x3b82f6,0xef4444,0x64748b];
  for(let r=0;r<7;r++){
    for(let i=0;i<90;i++){
      g.fillStyle(colors[(i+r)%colors.length],.9);
      g.fillCircle(i*w/90+8,18+r*21,Phaser.Math.Between(4,7));
    }
  }
  // ad boards
  g.fillStyle(0x93c5fd,1);g.fillRoundedRect(120,145,w-240,32,6);
  g.fillStyle(0x0ea5e9,.75);g.fillRoundedRect(150,150,w-300,22,5);

  // angled pitch base
  const topY=170,bottomY=h-60,leftTop=160,rightTop=w-160,leftBottom=40,rightBottom=w-40;
  const pitch=new Phaser.Geom.Polygon([leftTop,topY,rightTop,topY,rightBottom,bottomY,leftBottom,bottomY]);
  g.fillStyle(0x16803a,1);g.fillPoints(pitch.points,true);

  // mowing stripes as polygons
  const stripes=15;
  for(let i=0;i<stripes;i++){
    const t1=i/stripes,t2=(i+1)/stripes;
    const x1=Phaser.Math.Linear(leftTop,rightTop,t1);
    const x2=Phaser.Math.Linear(leftTop,rightTop,t2);
    const x3=Phaser.Math.Linear(leftBottom,rightBottom,t2);
    const x4=Phaser.Math.Linear(leftBottom,rightBottom,t1);
    g.fillStyle(i%2?0x1aa245:0x147a35,.82);
    g.fillPoints([{x:x1,y:topY},{x:x2,y:topY},{x:x3,y:bottomY},{x:x4,y:bottomY}],true);
  }

  // grass specks
  for(let i=0;i<900;i++){
    const y=Phaser.Math.Between(topY+10,bottomY-10);
    const lx=Phaser.Math.Linear(leftTop,leftBottom,(y-topY)/(bottomY-topY));
    const rx=Phaser.Math.Linear(rightTop,rightBottom,(y-topY)/(bottomY-topY));
    const x=Phaser.Math.Between(lx,rx);
    g.lineStyle(1,i%2?0x22c55e:0x14532d,.25);
    g.lineBetween(x,y,x+Phaser.Math.Between(-10,10),y+Phaser.Math.Between(2,8));
  }

  // pitch lines
  g.lineStyle(5,0xffffff,.48);
  g.strokePoints(pitch.points,true);
  const midX=w/2;
  g.lineBetween(midX,topY,midX,bottomY);
  g.strokeEllipse(midX,(topY+bottomY)/2,180,120);
  // boxes
  g.strokeRect(leftBottom+80,(topY+bottomY)/2-125,260,250);
  g.strokeRect(rightBottom-340,(topY+bottomY)/2-125,260,250);
  g.strokeRect(leftBottom+80,(topY+bottomY)/2-62,110,124);
  g.strokeRect(rightBottom-190,(topY+bottomY)/2-62,110,124);

  this.drawGoal(leftBottom+20,(topY+bottomY)/2,'left');
  this.drawGoal(rightBottom-20,(topY+bottomY)/2,'right');

  // virtual joystick and buttons like mobile football
  // bottom joystick/buttons removed; gameplay actions are below the question panel.
 }
 drawGoal(x,y,side){
  const g=this.add.graphics().setDepth(3);
  g.lineStyle(7,0xf8fafc,1);
  if(side==='left'){
    g.strokeRect(x,y-90,115,180);
    g.lineStyle(2,0xffffff,.55);
    for(let i=0;i<9;i++)g.lineBetween(x+i*14,y-90,x+i*14,y+90);
    for(let j=0;j<10;j++)g.lineBetween(x,y-90+j*18,x+115,y-90+j*18);
  }else{
    g.strokeRect(x-115,y-90,115,180);
    g.lineStyle(2,0xffffff,.55);
    for(let i=0;i<9;i++)g.lineBetween(x-115+i*14,y-90,x-115+i*14,y+90);
    for(let j=0;j<10;j++)g.lineBetween(x-115,y-90+j*18,x,y-90+j*18);
  }
 }
 drawControls(){
  const w=this.W,h=this.H;
  const joy=this.add.graphics().setDepth(4);
  joy.lineStyle(6,0xbfdbfe,.55);joy.strokeCircle(130,h-130,80);
  joy.fillStyle(0xffffff,.7);joy.fillCircle(130,h-130,34);
  const btns=[['pass',w-250,h-115,0x38bdf8],['shoot',w-130,h-160,0xef4444],['dribble',w-135,h-55,0x22c55e]];
  btns.forEach(([txt,x,y,col])=>{
    joy.lineStyle(5,col,.75);joy.strokeCircle(x,y,58);joy.fillStyle(col,.18);joy.fillCircle(x,y,58);
    this.add.text(x,y,txt,{fontSize:'22px',fontStyle:'bold',color:'#ffffff',stroke:'#000',strokeThickness:4}).setOrigin(.5).setDepth(5);
  });
  // minimap
  const mx=w/2-140,my=h-120;
  joy.lineStyle(3,0xffffff,.45);joy.strokeRect(mx,my,280,95);joy.lineBetween(mx+140,my,mx+140,my+95);
  for(let i=0;i<5;i++){joy.fillStyle(0xfacc15,1);joy.fillCircle(mx+40+i*22,my+25+i%2*35,6);joy.fillStyle(0xffffff,1);joy.fillCircle(mx+220-i*22,my+25+i%2*35,6);}
 }
 makePlayer(x,y,color,label){
  const c=this.add.container(x,y).setSize(56,78).setInteractive({useHandCursor:true}).setDepth(30);
  c.homeX=x;c.homeY=y;
  const sh=this.add.ellipse(0,42,62,18,0x000000,.42);
  const legs=this.add.graphics();legs.lineStyle(8,0x111827,1);legs.lineBetween(-10,24,-18,48);legs.lineBetween(10,24,18,48);
  const body=this.add.ellipse(0,0,42,58,color,1).setStrokeStyle(4,0xffffff,.55);
  const stripe=this.add.rectangle(0,0,8,52,0xffffff,.65);
  const head=this.add.circle(0,-38,18,0xf1c27d);
  const tx=this.add.text(0,2,label,{fontSize:label==='GK'?'16px':'18px',fontStyle:'900',stroke:'#000',strokeThickness:3}).setOrigin(.5);
  c.add([sh,legs,body,stripe,head,tx]);return c;
 }
 createTeams(){
  this.homePos=[[330,610],[600,395],[870,655],[1180,420],[1430,580]];
  this.awayPos=[[1500,330],[1230,640],[965,360],[700,650],[460,420]];
  this.homePos.forEach((p,i)=>this.home.push(this.makePlayer(p[0],p[1],0xfacc15,String(i+1))));
  this.awayPos.forEach((p,i)=>this.away.push(this.makePlayer(p[0],p[1],0x1f2937,String(i+1))));
  this.homeGK=this.makePlayer(170,520,0x38bdf8,'GK');
  this.awayGK=this.makePlayer(this.W-170,390,0x38bdf8,'GK');
  this.current=this.home[0];
 }
 createBall(){this.ball=this.add.circle(this.W/2,this.H/2+45,18,0xffffff).setStrokeStyle(3,0x000).setDepth(80)}
 createHUD(){
  this.scoreText=this.add.text(20,18,'00:00   MGL 0-0 RED',{fontSize:'34px',fontStyle:'900',color:'#fff',backgroundColor:'#000000aa',padding:{x:14,y:8}}).setDepth(200);
  this.msg=this.add.text(this.W/2,112,'Kick-off хийхэд бэлэн!',{fontSize:'40px',fontStyle:'900',color:'#fff',backgroundColor:'#000000cc',padding:{x:24,y:14}}).setOrigin(.5).setDepth(200);
 }
 updateHUD(){const min=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');this.scoreText.setText(`${min}:${s}   MGL ${goals}-${oppGoals} RED`)}
 setMsg(t){this.msg.setText(t)}
 resetKickoff(){
  this.clearMarkers();
  this.home.forEach((p,i)=>{p.x=this.homePos[i][0];p.y=this.homePos[i][1];p.setScale(1);p.angle=0});
  this.away.forEach((p,i)=>{p.x=this.awayPos[i][0];p.y=this.awayPos[i][1];p.setScale(1);p.angle=0});
  this.homeGK.x=170;this.homeGK.y=520;this.awayGK.x=this.W-170;this.awayGK.y=390;
  this.current=this.home[0];this.ball.x=this.W/2;this.ball.y=this.H/2+45;this.setMsg('Kick-off: асуултаа зөв хариулаад довтол!');
 }
 clearMarkers(){this.markers.forEach(m=>m.destroy());this.markers=[]}
 showPassOptions(){
  this.clearMarkers();this.setMsg('PASS: гэрэлтсэн тоглогчоос сонго');
  const cand=this.home.filter(p=>p!==this.current&&p.x>=this.current.x-60).slice(0,3);
  if(!cand.length)cand.push(this.home[4]);
  cand.forEach(p=>{
    const r=this.add.circle(p.x,p.y,56,0xfacc15,.2).setStrokeStyle(6,0xfacc15,1).setDepth(90).setInteractive({useHandCursor:true});
    const t=this.add.text(p.x,p.y-78,'PASS',{fontSize:'22px',fontStyle:'900',color:'#facc15',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(91);
    r.on('pointerdown',()=>window.choosePassTarget(p));p.on('pointerdown',()=>window.choosePassTarget(p));
    this.tweens.add({targets:r,scale:1.12,yoyo:true,repeat:-1,duration:420});this.markers.push(r,t);
  });
 }
 passTo(target,cb){
  this.clearMarkers();sound('pass');const from=this.current;this.setMsg('PASS!');
  this.tweens.add({targets:from,x:this.ball.x-12,y:this.ball.y-12,duration:280,onComplete:()=>{
    this.cameras.main.shake(80,.004);
    this.tweens.add({targets:this.ball,x:target.x+24,y:target.y+30,duration:520,ease:'Cubic.easeOut',onComplete:()=>{this.current=target;this.tweens.add({targets:target,scale:1.18,yoyo:true,duration:140});cb&&cb()}});
    this.tweens.add({targets:from,x:from.homeX,y:from.homeY,duration:360,delay:120});
  }});
 }
 dribble(cb){sound('pass');const p=this.current;this.setMsg('DRIBBLE!');const nx=Math.min(this.W-280,p.x+130),ny=p.y+(Math.random()>.5?45:-45);this.tweens.add({targets:p,x:nx,y:ny,duration:430});this.tweens.add({targets:this.ball,x:nx+26,y:ny+32,duration:430,onComplete:cb})}
 enemyCounter(cb){
  sound('bad');const e=this.away[Math.floor(Math.random()*this.away.length)];this.setMsg('INTERCEPTION!');
  this.tweens.add({targets:e,x:this.ball.x-12,y:this.ball.y-12,duration:300,onComplete:()=>{
    this.tweens.add({targets:this.ball,x:e.x-90,y:e.y+26,duration:430});
    this.tweens.add({targets:e,x:e.homeX,y:e.homeY,duration:360,delay:120,onComplete:cb});
  }});
 }
 enemyShoot(cb){
  sound('shot');const e=this.away[Math.floor(Math.random()*this.away.length)];this.setMsg('RED COUNTER ATTACK!');
  this.tweens.add({targets:e,x:this.ball.x-10,y:this.ball.y-10,duration:260,onComplete:()=>{
    const scored=Math.random()<.42,ty=scored?520:455;
    this.tweens.add({targets:this.homeGK,y:ty,angle:18,yoyo:true,duration:350});
    this.tweens.add({targets:this.ball,x:scored?90:170,y:ty,duration:560,ease:'Cubic.easeIn',onComplete:()=>{
      if(scored){sound('goal');this.goalFX('RED GOAL!');this.setMsg('Эсрэг баг гоол орууллаа!')}else{sound('save');this.setMsg('Манай хаалгач хаалаа!')}
      cb&&cb(scored);
    }});
  }});
 }
 shoot(chance,cb){
  const p=this.current;sound('shot');this.setMsg('SHOOT!');
  this.tweens.add({targets:p,x:this.ball.x-10,y:this.ball.y-10,duration:260,onComplete:()=>{
    const scored=Math.random()<chance,ty=scored?390:320;
    this.tweens.add({targets:this.awayGK,y:ty,angle:-18,yoyo:true,duration:350});
    this.tweens.add({targets:this.ball,x:scored?this.W-90:this.W-175,y:ty,duration:560,ease:'Cubic.easeIn',onComplete:()=>{
      if(scored){sound('goal');this.goalFX('GOOOOL!');this.setMsg('GOAL!')}else{sound('save');this.setMsg('Хаалгач хаалаа!')}
      cb&&cb(scored);
    }});
  }});
 }
 goalFX(text){
  const t=this.add.text(this.W/2,this.H/2,text,{fontSize:'96px',fontStyle:'900',color:'#facc15',stroke:'#000',strokeThickness:10}).setOrigin(.5).setDepth(300);
  for(let i=0;i<36;i++){const d=this.add.circle(this.W/2+Phaser.Math.Between(-260,260),this.H/2+Phaser.Math.Between(-90,90),Phaser.Math.Between(5,10),[0xfacc15,0xffffff,0x22c55e][i%3]).setDepth(250);this.tweens.add({targets:d,y:d.y+Phaser.Math.Between(90,180),alpha:0,duration:900,onComplete:()=>d.destroy()})}
  this.tweens.add({targets:t,scale:1.2,yoyo:true,repeat:2,duration:160,onComplete:()=>t.destroy()});
 }
}

new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1700,height:900,backgroundColor:'#166534',scene:RealLookScene,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});

function updateHUD(){if(sceneRef)sceneRef.updateHUD()}
function startClock(){clearInterval(timer);timer=setInterval(()=>{sec++;if(sceneRef)sceneRef.updateHUD();if(sec>=180){finishGame()}},1000)}
function shuffleQuestions(list){
  const arr=[...list];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function closeIntro(){studentName=document.getElementById('studentName').value.trim();document.getElementById('intro').style.display='none';startGame()}
function startGame(){initAudio();sound('whistle');idx=0;half=1;sec=0;goals=0;oppGoals=0;correct=0;attack=0;passesMade=0;locked=false;resultSent=false;activeQuestions=shuffleQuestions(questions);if(sceneRef)sceneRef.resetKickoff();startClock();loadQuestion();updateHUD()}
function loadQuestion(){
  if(!activeQuestions.length) activeQuestions=shuffleQuestions(questions);
  actEl.innerHTML='';locked=false;if(idx>=activeQuestions.length){finishGame();return}
  const item=activeQuestions[idx];catEl.textContent='';qEl.textContent=item.q;ansEl.innerHTML='';
  item.a.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>answer(i);ansEl.appendChild(b)});
}
function answer(i){
  if(locked)return;locked=true;const item=questions[idx];[...ansEl.children].forEach(b=>b.disabled=true);
  if(i===item.c){correct++;attack=Math.min(4,attack+1);qEl.textContent='Зөв! Одоо үйлдлээ сонго.';showActions()}
  else{qEl.textContent='Буруу. Зөв хариулт: '+item.a[item.c];attack=Math.max(0,attack-1);sceneRef.enemyCounter(()=>{if(Math.random()<.72){sceneRef.enemyShoot(scored=>{if(scored){oppGoals++;sceneRef.resetKickoff()}idx++;updateHUD();setTimeout(loadQuestion,600)})}else{idx++;setTimeout(loadQuestion,600)}})}
}
function showActions(){
  ansEl.innerHTML='';actEl.innerHTML='';
  const p=document.createElement('button');p.className='blue';p.textContent='PASS';p.onclick=()=>{actEl.innerHTML='';sceneRef.showPassOptions()};
  const d=document.createElement('button');d.className='yellow';d.textContent='DRIBBLE';d.onclick=()=>{actEl.innerHTML='';sceneRef.dribble(()=>{attack++;idx++;loadQuestion()})};
  const s=document.createElement('button');s.className='red';s.textContent='SHOOT';s.onclick=()=>shootNow();
  actEl.append(p,d,s);
}
window.choosePassTarget=function(target){actEl.innerHTML='';sceneRef.passTo(target,()=>{passesMade++;idx++;loadQuestion()})}
function shootNow(){actEl.innerHTML='';const chance=Math.min(.86,.18+attack*.16+(sceneRef.current.x>1250?.18:0));sceneRef.shoot(chance,scored=>{if(scored){goals++;attack=0;sceneRef.resetKickoff()}else attack=0;idx++;updateHUD();setTimeout(loadQuestion,700)})}
function finishGame(){clearInterval(timer);sendResultToSheet();sound('whistle');catEl.textContent='Тоглолтын дүн';qEl.textContent=`Тоглолт дууслаа. MGL ${goals}-${oppGoals} RED. Зөв хариулт: ${correct}/40. Үр дүн Google Sheet рүү илгээгдлээ.`;ansEl.innerHTML='<button class="green" onclick="startGame()">Дахин тоглох</button>';actEl.innerHTML='';updateHUD()}
</script>
